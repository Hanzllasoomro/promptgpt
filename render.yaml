# Render blueprint: one web service for the backend, one static site for
# the frontend. After deploy, set the frontend's VITE_API_URL (or the
# static site's env) to the backend URL and redeploy the frontend.
services:
  - type: web
    name: promptgpt-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: CORS_ORIGINS
        value: https://promptgpt-frontend.onrender.com
  - type: web
    name: promptgpt-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
