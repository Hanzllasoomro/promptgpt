# Publish both images to Docker Hub.
#
# On every push to main (that touches the app or the compose files),
# the backend and frontend images are built and pushed as
#   <DOCKERHUB_USERNAME>/promptgpt-backend:latest (+ :sha-<short>)
#   <DOCKERHUB_USERNAME>/promptgpt-frontend:latest (+ :sha-<short>)
# The EC2 deploy then pulls these instead of building on the host
# (it still builds as a fallback if the pull fails).
#
# Required repository secrets (Settings → Secrets and variables →
# Actions → Secrets):
#   DOCKERHUB_USERNAME  your Docker Hub username (lowercase)
#   DOCKERHUB_TOKEN     a Docker Hub access token (Account Settings →
#                       Security → New Access Token). Use a token, not
#                       your account password.
#
# The Docker Hub repositories must be public (or the EC2 host must
# `docker login` first) — the images contain no secrets: keys are
# bring-your-own in the browser, and server fallbacks are runtime
# env vars, never baked into the image.
#
# NOTE: this file cannot be pushed by the assistant's GitHub App
# (it lacks workflow permission). Add it from your PC — see
# docs/EC2_DEPLOY.md.
name: Publish to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "caddy/**"
      - ".github/workflows/docker-hub.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend image tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/promptgpt-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
      - name: Frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/promptgpt-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}