# CI: backend tests, frontend build, and Docker build + compose smoke test.
# Runs on pushes to main and on pull requests. No secrets are needed:
# nothing is pushed to a registry and nothing is deployed from here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-langchain.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt -r backend/requirements-langchain.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build + compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: promptgpt-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: promptgpt-frontend:ci
      - name: Validate compose file
        run: docker compose config -q
      - name: Start the stack
        run: docker compose up -d --build
      - name: Smoke test (backend direct + via the nginx /api proxy)
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:5173/api/health
          curl -fsS http://localhost:5173/ | grep -qi promptgpt
      - name: Stop the stack
        if: always()
        run: docker compose down -v
