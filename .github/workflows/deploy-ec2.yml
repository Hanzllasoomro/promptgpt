# Deploy to a single EC2 host running docker compose.
#
# How it works: on every push to main (that touches the app or the
# compose files) the workflow SSHs into the EC2 instance, pulls the
# latest code, and runs `docker compose up -d --build`. No registry
# is involved — the images are built on the host.
#
# Required repository secrets (Settings → Secrets and variables →
# Actions → Secrets):
#   EC2_HOST     public IP or DNS name of the instance (use an Elastic IP)
#   EC2_USER     SSH user, e.g. ubuntu
#   EC2_SSH_KEY  private key matching the instance's authorized key
#                (the .pem from launch, or a dedicated deploy key)
#
# Optional repository variable (same page, Variables tab):
#   DOMAIN       your domain, e.g. promptgpt.example.com. When set, the
#                deploy uses docker-compose.prod.yml, which adds Caddy
#                for automatic TLS on 80/443. Leave it unset to serve
#                the app on :5173 by public IP. Add it later and the
#                next deploy switches to HTTPS automatically.
#
# First run: the workflow file itself does not match the paths filter,
# so trigger the first deploy manually from the Actions tab
# ("Run workflow"). See docs/EC2_DEPLOY.md for the full setup.
name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "caddy/**"
  workflow_dispatch:

# Never run two deploys at once on the same host.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ -d ~/promptgpt/.git ]; then
              cd ~/promptgpt
              git pull origin main
            else
              git clone https://github.com/Hanzllasoomro/promptgpt.git ~/promptgpt
              cd ~/promptgpt
            fi
            # With DOMAIN set (repository variable), the production
            # override adds Caddy for TLS; without it the app serves
            # on :5173 by public IP.
            if [ -n "${{ vars.DOMAIN }}" ]; then
              DOMAIN="${{ vars.DOMAIN }}" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            else
              docker compose up -d --build
            fi
            docker compose ps
            curl -fsS http://localhost:8000/api/health
            curl -fsS http://localhost:5173/api/health
            docker image prune -f
