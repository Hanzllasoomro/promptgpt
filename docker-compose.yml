services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173
    # Optional server-side fallbacks; normally leave empty (BYO key).
    # OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
